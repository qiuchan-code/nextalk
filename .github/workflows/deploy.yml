# 每次推到 main 分支，自动构建并发布到 GitHub Pages
# 使用前需要在仓库 Settings → Pages 的 Source 里选 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# 权限：GITHUB_TOKEN 需要有写 Pages 和内容读取的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一个仓库同时只能跑一个部署，旧的自动取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
